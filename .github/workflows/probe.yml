# One-off probe: what can the runner reach, which odds secrets exist, what Hard Rock offers. Writes probe/out/ and commits it.
name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['probe/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: probe
        env:
          SEC_ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          SEC_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SEC_ODDS_KEYS: ${{ secrets.ODDS_KEYS }}
          SEC_ODDS_KEY: ${{ secrets.ODDS_KEY }}
          SEC_THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SEC_THE_ODDS_API_KEYS: ${{ secrets.THE_ODDS_API_KEYS }}
          SEC_ODDS_API_KEYS_NFL: ${{ secrets.ODDS_API_KEYS_NFL }}
          SEC_NFL_ODDS_API_KEYS: ${{ secrets.NFL_ODDS_API_KEYS }}
          SEC_ODDS_API_KEY_1: ${{ secrets.ODDS_API_KEY_1 }}
          SEC_ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          SEC_ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          SEC_ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          SEC_ODDS_API_KEY_5: ${{ secrets.ODDS_API_KEY_5 }}
          SEC_ODDS_API_KEY_6: ${{ secrets.ODDS_API_KEY_6 }}
          SEC_ODDS_API_KEY_7: ${{ secrets.ODDS_API_KEY_7 }}
          SEC_ODDS_API_KEY_8: ${{ secrets.ODDS_API_KEY_8 }}
          SEC_ODDS_API_KEY1: ${{ secrets.ODDS_API_KEY1 }}
          SEC_ODDS_API_KEY2: ${{ secrets.ODDS_API_KEY2 }}
          SEC_ODDS_API_KEY3: ${{ secrets.ODDS_API_KEY3 }}
          SEC_ODDS_API_KEY4: ${{ secrets.ODDS_API_KEY4 }}
          SEC_ODDS_API_KEY5: ${{ secrets.ODDS_API_KEY5 }}
          SEC_ODDS_API_KEY6: ${{ secrets.ODDS_API_KEY6 }}
          SEC_ODDS_API_KEY7: ${{ secrets.ODDS_API_KEY7 }}
          SEC_ODDS_API_KEY8: ${{ secrets.ODDS_API_KEY8 }}
        run: mkdir -p probe/out && python3 probe/probe.py > probe/out/log.txt 2>&1; echo "exit $?" >> probe/out/log.txt
      - name: commit
        if: always()
        run: |
          git config user.name prop-check-bot; git config user.email bot@users.noreply.github.com
          git add probe/out && git commit -q -m "probe results" && git push -q || echo "nothing to commit"
