# One-off probe: what can the runner reach, which odds secrets exist, what Hard Rock offers. Writes probe/out/ and commits it.
name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['probe/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: probe
        env:
          PC_ALL_SECRETS: ${{ toJSON(secrets) }}
        run: python3 probe/probe.py
      - name: commit
        run: |
          git config user.name prop-check-bot; git config user.email bot@users.noreply.github.com
          git add probe/out && git commit -q -m "probe results" && git push -q || echo "nothing to commit"
