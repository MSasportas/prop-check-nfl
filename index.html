<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prop Check">
<title>Prop Check NFL</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0b1118; --surface:#121b25; --raise:#18232f; --line:#22303f; --line2:#35485c;
  --fg:#e7eef5; --muted:#8a9bad; --accent:#6cc4f0; --good:#6fcf97; --warn:#f0b95c; --bad:#f0897a;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/20px var(--font);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;padding:var(--sat) 16px calc(52px + var(--sab) + 24px)}
.mu{color:var(--muted)}
[hidden]{display:none!important}
.pos{color:var(--good)} .neg{color:var(--bad)} .wrn{color:var(--warn)}
.b{font-weight:700}

/* header */
.hdr{display:flex;align-items:baseline;gap:8px;padding-top:12px}
.hdr h1{font:700 22px/26px var(--font);letter-spacing:-.01em;margin:0;flex:1;min-width:0}
.hdr .wk{font:600 15px/20px var(--font);color:var(--muted);white-space:nowrap}
.upd{font-size:13px;line-height:18px;color:var(--muted);margin:2px 0 0}
.upd.stale{color:var(--warn);font-weight:600}
.tag-test{font-size:12px;line-height:16px;margin-top:6px;padding:2px 8px;border:1px dashed var(--warn);border-radius:6px;color:var(--warn)}

/* banners */
.banner{display:flex;gap:10px;padding:10px 12px;margin-top:10px;border-radius:10px;border:1px solid var(--warn);
  background:rgba(240,185,92,.08);font-size:14px;line-height:20px}
.banner .ic{flex:none;color:var(--warn);margin-top:1px;display:flex}
.banner.stop{border-color:var(--bad);background:rgba(240,137,122,.08)} .banner.stop .ic{color:var(--bad)}
.banner.info{border-color:var(--line);background:var(--surface)} .banner.info .ic{color:var(--accent)}
.banner .txt{min-width:0;flex:1;overflow-wrap:anywhere}
.banner .sub{display:block;font-size:13px;line-height:18px;color:var(--muted);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);font-weight:600;font-size:14px}

/* checks panel */
.checks{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:2px 12px}
.ck{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.ck:last-child{border-bottom:0}
.ck .k{flex:none;width:92px;color:var(--muted)}
.ck .v{flex:1;min-width:0;overflow-wrap:anywhere}

/* sections */
.dayh{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dayh h2{font:700 20px/24px var(--font);letter-spacing:-.01em;margin:0;flex:1;min-width:0}
.dayh .mu{font-size:12px;white-space:nowrap}
.dayh.btnh{width:100%;min-height:44px;align-items:center}
.chev{flex:none;color:var(--muted);display:flex}
.btnh[aria-expanded="true"] .chev{transform:rotate(180deg)}
.stack>*+*{margin-top:8px}
.sec{margin-top:22px}
.sec h2{font:700 20px/24px var(--font);letter-spacing:-.01em;margin:0}
.sec-sub{font-size:13px;line-height:18px;color:var(--muted);margin:2px 0 8px}
.divl{font-size:12px;line-height:16px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.morebtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:44px;margin-top:8px;border:1px solid var(--line2);border-radius:10px;color:var(--accent);font-weight:600;text-align:center}

/* pick card */
.card{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:hidden;cursor:pointer}
.card[aria-expanded="true"]{border-color:var(--line2)}
.r1{display:flex;align-items:baseline;gap:8px}
.rank{font:700 16px/22px var(--font);color:var(--accent);flex:none;min-width:12px}
.name{font:700 16px/22px var(--font);flex:1;min-width:0;overflow-wrap:anywhere}
.meta{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;flex:none}
.r2{display:flex;align-items:flex-start;gap:10px;margin-top:4px}
.bet{font:700 20px/24px var(--font);letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
.pbox{flex:none;text-align:right;min-width:68px}
.betlink{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:10px;border:1px solid var(--accent);border-radius:10px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
.mtag.dk{color:var(--warn);border-color:var(--warn)}
.pbox .pl{font-size:11px;line-height:14px;color:var(--muted)}
.pbox .pv{font:700 30px/32px var(--font);letter-spacing:-.02em;white-space:nowrap}
.pbox .pb{font-size:11px;line-height:14px;color:var(--muted)}
.vs{font-size:13px;line-height:18px;margin-top:6px;color:var(--good);font-weight:600;overflow-wrap:anywhere}
.reason{font-size:14px;line-height:20px;margin-top:4px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:2px 9px 2px 7px;border-radius:12px;font-size:12px;line-height:16px;
  background:var(--raise);border:1px solid var(--line);color:var(--fg);max-width:100%}
.chip svg{flex:none}
.chip.ok{color:var(--good);border-color:rgba(111,207,151,.45)}
.chip.mid{color:var(--accent);border-color:rgba(108,196,240,.45)}
.chip.lock{color:var(--muted)}
.chip.hollow{background:none;border-color:var(--line2);color:var(--muted)}
.foot1{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-size:12px;line-height:16px;color:var(--muted)}
.foot1 .g{flex:1;min-width:0;overflow-wrap:anywhere}
.foot1 .stt{flex:none;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.stt.open{color:var(--good)} .stt.locked{color:var(--muted)} .stt.pulled{color:var(--bad)}
.more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:19px}
.more>div+div{margin-top:6px}
.hist{margin:2px 0 0;padding:0;list-style:none}
.hist li{display:flex;gap:8px}
.hist time{flex:none;min-width:84px;color:var(--muted)}
.res{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;font-size:14px;line-height:20px}
.res .tg{font:700 18px/20px var(--font)}
.pullbar{display:flex;gap:8px;align-items:flex-start;margin:-10px -12px 10px;padding:9px 12px;background:var(--raise);
  border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.pullbar .ic{flex:none;display:flex;color:var(--bad);margin-top:1px}
.pullbar .why{min-width:0;overflow-wrap:anywhere}
.ifbet{font-size:13px;line-height:19px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--raise);overflow-wrap:anywhere}
.dim .body{opacity:.6}
.dim .vs{color:var(--muted)}
.dim .pv{color:var(--muted)}

/* games */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.gm{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.gm:last-child{border-bottom:0}
.gm .l1{display:flex;gap:8px;align-items:baseline}
.gm .nm{font:700 16px/22px var(--font);flex:1;min-width:0}
.gm .tm{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}
.gm .l2{color:var(--muted);overflow-wrap:anywhere}
.gm .l2 b{font-weight:600;color:var(--fg)}
.gm .l2 .wrn{color:var(--warn)}

/* rules / foot */
.rules{margin:8px 0 0;padding:0 0 0 22px}
.rules li{margin:0 0 10px;padding-left:2px;line-height:20px;overflow-wrap:anywhere}
.foot{margin-top:26px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--muted)}

/* empty + skeleton */
.empty{margin-top:14px;padding:14px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.empty .t{font-size:16px;line-height:23px;font-weight:600}
.empty .s{font-size:13px;line-height:19px;color:var(--muted);margin-top:4px}
.skel{height:130px;border-radius:10px;background:var(--surface);border:1px solid var(--line);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabs .in{max-width:520px;margin:0 auto;display:flex;height:52px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:52px;color:var(--muted);font:700 16px/20px var(--font);position:relative;text-align:center}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.tab .n{font:600 12px/18px var(--font);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--raise);color:var(--fg);text-align:center}

/* record */
.hl{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.hl .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hl .wl{font:700 40px/44px var(--font);letter-spacing:-.02em}
.hl .un{font:700 28px/34px var(--font);letter-spacing:-.02em}
.hl .cap{font-size:12px;line-height:16px;color:var(--muted)}
.hl .hit{margin-top:6px;font-size:14px;line-height:20px}
.mtag{display:inline-block;margin-top:6px;padding:1px 8px;border:1px solid var(--line2);border-radius:10px;font-size:12px;line-height:16px;color:var(--accent)}
.hl.ps .wl{font-size:30px;line-height:34px} .hl.ps .un{font-size:22px;line-height:28px} .hl.ps h2{font:700 16px/22px var(--font);margin:0 0 4px}
.hl .small{margin-top:6px;font-size:13px;line-height:18px;color:var(--warn)}
.tbl{margin-top:14px;font-size:13px;line-height:18px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 52px 44px 58px;column-gap:6px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.tr.th{font-size:12px;line-height:15px;color:var(--muted);padding:0 0 4px}
.tr>*{text-align:right;white-space:nowrap}
.tr>:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
.tr .num{font:700 15px/18px var(--font)}
.tr small{display:block;font-size:11px;line-height:14px;color:var(--muted)}
.wkh{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:10px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.wkh h3{font:700 17px/22px var(--font);margin:0;flex:1;min-width:0}
.wkh .mu{font-size:12px;white-space:nowrap}
.wkh[aria-expanded="true"] .chev{transform:rotate(180deg)}
.ent{display:flex;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.ent .tg{flex:none;width:62px;font:700 14px/20px var(--font)}
.tg.W{color:var(--good)} .tg.L{color:var(--bad)} .tg.PUSH,.tg.VOID,.tg.none{color:var(--muted)}
.ent .bd{flex:1;min-width:0}
.ent .e1{font-size:14px;line-height:20px;overflow-wrap:anywhere}
.ent .e1 b{font-weight:600}
.ent .e2{font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
.ent .u{flex:none;font:700 14px/20px var(--font);white-space:nowrap}
.ent.dim .bd,.ent.dim .tg,.ent.dim .u{opacity:.6}
.retired{margin-top:26px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}
.retired .rh{display:flex;align-items:center;gap:8px;width:100%;min-height:48px}
.retired .rh h2{font:700 16px/22px var(--font);margin:0;flex:1;min-width:0}
.retired .rh[aria-expanded="true"] .chev{transform:rotate(180deg)}
.retired .rb{padding-bottom:12px}
.note{font-size:12px;line-height:17px;color:var(--muted);margin:4px 0}
</style>
</head>
<body>

  <div class="hdr"><h1>Prop Check NFL</h1></div>
  <p class="upd">Loading this week's picks</p>
  <div class="stack" style="margin-top:12px"><div class="skel"></div><div class="skel"></div></div>
</div>
<nav id="tabs" class="tabs" aria-label="Views"></nav>
<noscript><p style="padding:16px">Prop Check NFL needs JavaScript turned on.</p></noscript>

    h('div', { class: 'tg ' + r, text: r === 'none' ? (pulled || e.state === 'pulled' ? 'Pulled' : 'Started') : r }),
    h('div', { class: 'bd' },
      h('div', { class: 'e1' }, h('b', { text: str(e.player) }), ' ', str(e.bet)),
      h('div', { class: 'e2', text: e2 }),
      e.state === 'locked' && !pulled ? h('div', { class: 'e2', text: 'Started, grading after the game.' }) : null,
      pulled && e.pulled.reason ? h('div', { class: 'e2', text: 'Pulled: ' + str(e.pulled.reason) }) : null,
      pulled && e.pulled.if_bet ? h('div', { class: 'e2', text: str(e.pulled.if_bet) }) : null),
    h('div', { class: 'u ' + signCls(e.units), text: e.result ? units(e.units) || '' : '' }));
}
function weekBlock(w, idx, keyPre) {
  var key = keyPre + str(w.slate || w.week);
  var open = S.wkOpen[key] != null ? S.wkOpen[key] : idx === 0;
  var singles = arr(w.entries).filter(function (e) { return isObj(e) && e.kind !== 'parlay'; });
  var counted = singles.filter(function (e) { return !e.pulled; }), pulled = singles.filter(function (e) { return e.pulled; });
  var wl = num(w.w) != null && num(w.l) != null ? w.w + '-' + w.l : null;
  var right = w.graded ? [wl, units(w.units)].filter(Boolean).join(' · ') : (wl && (w.w + w.l) ? wl + ' so far' : 'In progress');
  var kids = [h('button', { class: 'wkh', 'aria-expanded': open ? 'true' : 'false', on: { click: function () { S.wkOpen[key] = !open; render(); } } },
    h('h3', { text: str(w.label) || 'Week ' + str(w.week) }), h('span', { class: 'mu', text: right }), h('span', { class: 'chev' }, icon('down', 18)))];
  if (open) {
    if (!counted.length && !pulled.length) kids.push(h('div', { class: 'note', text: 'No picks.' }));
    kids.push(counted.map(entryRow));
    if (pulled.length) {
      kids.push(h('div', { class: 'divl', text: 'Pulled, not counted' }));
      kids.push(pulled.map(entryRow));
    }
  }
  return h('div', {}, kids);
}
function hitLine(hd) {
  var hr = num(hd.hit_rate), nd = num(hd.needed);
  if (hr == null) return null;
  var cls = nd != null ? (hr >= nd ? 'pos' : 'neg') : '';
  return h('div', { class: 'hit' }, 'Hit rate ', h('b', { class: cls, text: pct(hr) }), nd != null ? [' · break-even ', h('b', { text: pct(nd) })] : null,
    nd != null ? h('span', { class: 'mu', text: hr >= nd ? ' (ahead)' : ' (behind)' }) : null);
}
function marketTable(rows) {
  rows = arr(rows).filter(function (r) { return isObj(r) && r.key !== 'parlays' && r.key !== 'pulled'; });
  if (!rows.length) return null;
  return h('div', { class: 'tbl' },
    h('div', { class: 'tr th' }, h('div', { text: 'Market' }), h('div', { text: 'W-L' }), h('div', { text: 'Hit' }), h('div', { text: 'Units' })),
    rows.map(function (r) {
      return h('div', { class: 'tr' },
        h('div', {}, str(r.label), num(r.needed) != null ? h('small', { text: 'break-even ' + pct(r.needed) }) : null),
        h('div', { class: 'num', text: r.w + '-' + r.l }),
        h('div', { class: 'num', text: pct(r.hit_rate) || '-' }),
        h('div', { class: 'num ' + signCls(r.units), text: units(r.units) || '-' }));
    }));
}
function retiredBlock(rt) {
  if (!isObj(rt)) return null;
  var hd = isObj(rt.summary) && isObj(rt.summary.headline) ? rt.summary.headline : null, open = S.retiredOpen, kids = [];
  kids.push(h('button', { class: 'rh', 'aria-expanded': open ? 'true' : 'false', on: { click: function () { S.retiredOpen = !S.retiredOpen; render(); } } },
    h('h2', { text: str(rt.label) || 'Retired rules' }), h('span', { class: 'chev' }, icon('down', 18))));
  if (open) {
    var b = [];
    if (rt.note) b.push(h('div', { class: 'note', text: str(rt.note) }));
    if (hd) b.push(h('div', { class: 'hit' }, h('b', { text: hd.w + '-' + hd.l }), ' singles, ', h('b', { class: signCls(hd.units), text: units(hd.units) || '' }),
      num(hd.hit_rate) != null ? ' · hit rate ' + pct(hd.hit_rate) : null, '. Not counted in the record above.'));
    arr(rt.weeks).forEach(function (w, i) { if (isObj(w)) b.push(weekBlock(w, 99, 'r:')); });
    kids.push(h('div', { class: 'rb' }, b));
  }
  return h('div', { class: 'retired' }, kids);
}
function pinSoloBlock(ps, title, capText) {
  /* the fallback method (era ps1): its own line, never added to the headline above; hidden until it has an entry */
  if (!isObj(ps)) return null;
  var weeks = arr(ps.weeks).filter(isObj);
  var hd = isObj(ps.summary) && isObj(ps.summary.headline) ? ps.summary.headline : { w: 0, l: 0, push: 0, void: 0, n: 0, units: 0 };
  var has = (num(hd.n) || 0) > 0 || weeks.some(function (w) { return arr(w.entries).some(isObj); });
  if (!has) return null;
  var n = num(hd.n) || 0, kids = [];
  kids.push(h('div', { class: 'hl ps' },
    h('h2', { text: title || 'Pinnacle moved: Hard Rock' }),
    h('div', { class: 'cap', text: capText || 'Separate method, kept apart from the record above' }),
    h('div', { class: 'row' },
      h('div', { class: 'wl', text: (hd.w || 0) + '-' + (hd.l || 0) + '-' + (hd.push || 0) }),
      h('div', { class: 'un ' + signCls(hd.units), text: units(hd.units) || '0.00u' })),
    n ? hitLine(hd) : h('div', { class: 'hit', text: 'No graded picks yet.' }),
    n && n < FINAL_ERA_MIN ? h('div', { class: 'small', text: 'Only ' + plural(n, 'graded pick') + ' so far. Too early to judge.' }) : null));
  weeks.forEach(function (w, i) { kids.push(weekBlock(w, i, 'ps:')); });
  return h('div', { class: 'sec' }, kids);
}
function viewRecord() {
  var r = S.record, out = [header(S.record && S.record.season ? S.record.season + ' season' : 'Record')];
  out.push(updatedLine());
  if (!isObj(r)) {
    out.push(empty(S.recordErr ? "Can't load the record." : 'Loading the record.', S.recordErr ? 'Try again in a minute.' : null));
    if (S.recordErr) out.push(h('div', { style: 'margin-top:12px' }, h('button', { class: 'btn', on: { click: function () { load().then(schedule); } } }, 'Try again')));
    return out;
  }
  var hd = isObj(r.summary) && isObj(r.summary.headline) ? r.summary.headline : { w: 0, l: 0, push: 0, void: 0, n: 0, units: 0 };
  var n = num(hd.n) || 0;
  out.push(h('div', { class: 'hl' },
    h('div', { class: 'cap', text: 'New rules, singles at the price posted, 1 unit each' }),
    h('div', { class: 'row' },
      h('div', { class: 'wl', text: (hd.w || 0) + '-' + (hd.l || 0) + '-' + (hd.push || 0) }),
      h('div', { class: 'un ' + signCls(hd.units), text: units(hd.units) || '0.00u' })),
    h('div', { class: 'cap', text: 'Wins - losses - pushes' + (hd.void ? ' · ' + plural(hd.void, 'void') : '') }),
    n ? hitLine(hd) : h('div', { class: 'hit', text: 'No graded picks yet. Results show up here after each game ends.' }),
    n && n < FINAL_ERA_MIN ? h('div', { class: 'small', text: 'Only ' + plural(n, 'graded pick') + ' so far. Too early to judge.' }) : null));
  out.push(marketTable(r.summary && r.summary.rows));
  var pr = arr(r.summary && r.summary.rows).filter(function (x) { return isObj(x) && x.key === 'pulled'; })[0];
  if (pr && (pr.w + pr.l)) out.push(h('div', { class: 'note', text: 'Pulled picks, graded but not counted above: ' + pr.w + '-' + pr.l + ', ' + (units(pr.units) || '0.00u') + '.' }));
  out.push(h('div', { class: 'sec' }, h('div', { class: 'dayh', style: 'margin-top:0' }, h('h2', { text: 'Every pick, as shown' }))));
  var weeks = arr(r.weeks).filter(isObj);
  if (!weeks.length && !arr(r.older).length) out.push(h('div', { class: 'note', text: 'Nothing posted yet.' }));
  weeks.forEach(function (w, i) { out.push(weekBlock(w, i, 'w:')); });
  var olderPaths = arr(r.older).filter(function (p) { return typeof p === 'string'; });
  if (olderPaths.length) {
    var loaded = olderPaths.filter(function (p) { return S.older[p]; });
    loaded.forEach(function (p) { S.older[p].forEach(function (w) { if (isObj(w)) out.push(weekBlock(w, 99, 'w:')); }); });
    if (loaded.length < olderPaths.length) {
      out.push(h('button', { class: 'morebtn', on: { click: loadOlder } }, S.olderBusy ? 'Loading' : 'Older weeks (' + (olderPaths.length - loaded.length) + ')'));
      if (S.olderErr) out.push(h('div', { class: 'note', text: "Some older weeks didn't load. Tap to try again." }));
    }
  }
  out.push(pinSoloBlock(r.pin_solo, 'Pinnacle moved: Hard Rock', 'Your Hard Rock picks from the Pinnacle-moves rule'));
  out.push(pinSoloBlock(r.draftkings, 'Pinnacle moved: DraftKings', 'Same rule at DraftKings, kept on its own line'));
  out.push(retiredBlock(r.retired));
  out.push(h('div', { class: 'foot' }, 'Every pick is graded at the price it was posted at, at its own book. Pulled picks are kept and marked, and never counted.'));
  return out;
}

/* ================= render ================= */
function renderTabs() {
  clear(tabsEl);
  var open = S.slate && S.slate.schema === 2 ? arr(S.slate.picks).filter(function (p) { return isObj(p) && p.state === 'open'; }).length : 0;
  var defs = [['picks', 'Picks', open], ['record', 'Record', 0]];
  tabsEl.appendChild(h('div', { class: 'in' }, defs.map(function (d) {
    return h('button', { class: 'tab', 'aria-current': S.view === d[0] ? 'page' : null, on: { click: function () { go(d[0]); } } },
      d[1], d[2] ? h('span', { class: 'n', text: d[2] }) : null);
  })));
}
function go(v) {
  if (S.view === v) { window.scrollTo(0, 0); return; }
  S.view = v;
  try { history.replaceState(null, '', (location.search || '') + (v === 'record' ? '#record' : '#picks')); } catch (e) { /* ignore */ }
  render(); window.scrollTo(0, 0);
}
function render() {
  var y = window.pageYOffset;
  clear(app);
  try {
    if (!S.loaded) {
      app.appendChild(h('div', {}, header(null), h('p', { class: 'upd', text: "Loading this week's picks" }), h('div', { class: 'stack', style: 'margin-top:12px' }, h('div', { class: 'skel' }), h('div', { class: 'skel' }))));
    } else if (!S.slate) {
      app.appendChild(loadFail('the picks', S.loadErr, function () { clear(app); app.appendChild(h('p', { class: 'upd', text: 'Trying again' })); load().then(schedule); }));
    } else {
      add(app, S.view === 'record' ? viewRecord() : viewPicks());
    }
  } catch (e) {
    clear(app);
    app.appendChild(loadFail('the page', 'file', function () { S.exp = {}; load().then(schedule); }));
    if (window.console) console.warn('render failed', e && e.message);
  }
  renderTabs();
  window.scrollTo(0, y);
}

try { if (location.hash === '#record') S.view = 'record'; } catch (e) { /* ignore */ }
render();
load().then(schedule);
document.addEventListener('visibilitychange', function () { if (!document.hidden) load().then(schedule); });
setInterval(function () { if (S.loaded && !document.hidden) render(); }, 60000);
})();
</script>
