<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prop Check">
<title>Prop Check NFL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b1118; --surface:#121b25; --raise:#18232f; --line:#22303f; --line2:#35485c;
  --fg:#e7eef5; --muted:#8a9bad; --accent:#6cc4f0; --good:#6fcf97; --warn:#f0b95c; --bad:#f0897a;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/20px var(--body);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;font-variant-numeric:inherit;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;padding:var(--sat) 16px calc(52px + var(--sab) + 24px)}
.mu{color:var(--muted)}
[hidden]{display:none!important}

/* header */
.hdr{display:flex;align-items:center;gap:8px;min-height:44px}
.hdr h1{font:600 22px/24px var(--display);letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .date{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap}
.ibtn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;margin-right:-10px;color:var(--muted)}
.back{margin:0 0 0 -12px}
.tag-test{font-size:12px;line-height:16px;padding:0 8px;border-bottom:1px dashed var(--warn);color:var(--warn);text-align:center}

/* rows */
.rowbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:4px 0}
.rowbtn .grow{flex:1;min-width:0}
.chev{flex:none;color:var(--muted);display:flex}
.statusline{font-size:12px;line-height:17px;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.statusline .warnt{color:var(--warn);font-weight:500}
.statusline .badt{color:var(--bad);font-weight:500}
.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip .grow{font:600 18px/22px var(--display);letter-spacing:.01em}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* period toggle (sticky) */
.ptog{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -16px;padding:8px 16px 8px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:5px;
  font:600 16px/20px var(--display);letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.seg button small{font:500 12px/16px var(--body);letter-spacing:0;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ptog-wrap{padding:3px 0}

/* banners */
.banner{display:flex;gap:10px;padding:10px 12px;margin-top:10px;border-radius:10px;border:1px solid var(--warn);
  background:rgba(240,185,92,.08);font-size:14px;line-height:20px}
.banner .ic{flex:none;color:var(--warn);margin-top:1px;display:flex}
.banner.stop{border-color:var(--bad);background:rgba(240,137,122,.08)} .banner.stop .ic{color:var(--bad)}
.banner.info{border-color:var(--line);background:var(--surface)} .banner.info .ic{color:var(--accent)}
.banner b{font-weight:500}
.banner .txt{min-width:0;flex:1;overflow-wrap:anywhere}
.linkbtn{display:inline-flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* sections */
.sec{margin-top:14px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 6px}
.sec-h h2,.secbtn h2{font:600 20px/24px var(--display);letter-spacing:.02em;margin:0}
.sec-h .mu{font-size:12px}
.sec-sub{font-size:13px;line-height:18px;color:var(--muted);margin:-2px 0 8px}
.secbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px}
.secbtn h2{flex:1}
.secbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.stack>*+*{margin-top:8px}
.dayh{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dayh h2{font:600 22px/26px var(--display);letter-spacing:.02em;margin:0;flex:1}
.dayh .mu{font-size:12px;white-space:nowrap}
.daynote{font-size:13px;line-height:18px;color:var(--warn);margin:-2px 0 8px}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.jump button{min-height:44px;display:inline-flex;align-items:center}
.jump span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);font-size:13px}
.jump b{font:600 16px/16px var(--display)}

/* cards */
.card{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:hidden}
.card[role=button]{cursor:pointer}
.card[aria-expanded="true"]{border-color:var(--line2)}
.r1{display:flex;align-items:baseline;gap:8px}
.rank{font:600 17px/22px var(--display);color:var(--accent);flex:none;min-width:12px}
.name{font:600 17px/22px var(--display);letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;flex:none}
.own{color:var(--fg);font-weight:500}
.r2{display:flex;align-items:flex-start;gap:8px;margin-top:2px}
.bet{font:600 21px/25px var(--display);letter-spacing:.01em;flex:1;min-width:0;overflow-wrap:anywhere;padding-top:1px}
.per{display:inline-block;font:600 13px/18px var(--display);letter-spacing:.06em;padding:0 5px;margin-right:6px;border-radius:4px;vertical-align:3px;
  border:1px solid var(--line2);color:var(--muted)}
.per.h1{border-color:rgba(108,196,240,.6);color:var(--accent)}
.price{font:600 28px/28px var(--display);min-width:72px;text-align:right;flex:none;white-space:nowrap}
.stamp{font-size:12px;line-height:16px;color:var(--muted);text-align:right;overflow-wrap:anywhere}
.stamp .worse{color:var(--warn)} .stamp .better{color:var(--good)}
.chance{font-size:13px;line-height:18px;margin-top:4px}
.chance b{font-weight:500}
.bar{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:4px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:rgba(108,196,240,.38)}
.bar i.over{background:var(--accent);border-radius:0 3px 3px 0}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--fg);border-radius:1px}
.reason{font-size:14px;line-height:20px;margin-top:6px;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:12px;font-size:12px;line-height:16px;
  background:var(--raise);border:1px solid var(--line);color:var(--fg);max-width:100%;white-space:nowrap}
.chip svg{flex:none}
.chip.ok{color:var(--good);border-color:rgba(111,207,151,.45)}
.chip.mid{color:var(--accent);border-color:rgba(108,196,240,.45)}
.chip.early{color:var(--warn);border-color:rgba(240,185,92,.45)}
.chip.lock{color:var(--muted)}
.chip.hollow{background:none;border-color:var(--muted);padding:0 9px}
.more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:19px}
.more>div+div{margin-top:6px}
.hist{margin:2px 0 0;padding:0;list-style:none}
.hist li{display:flex;gap:8px}
.hist time{flex:none;min-width:96px;color:var(--muted)}
.note{font-size:12px;line-height:17px;color:var(--muted);margin-top:8px}
.result{display:flex;align-items:baseline;gap:2px;margin:-2px 0 4px;font-size:14px;line-height:20px}
.result .tg{font:600 18px/20px var(--display);letter-spacing:.03em}

/* pulled */
.pullbar{display:flex;gap:8px;align-items:flex-start;margin:-10px -12px 10px;padding:9px 12px;background:var(--raise);
  border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.pullbar .ic{flex:none;display:flex;color:var(--bad);margin-top:1px}
.pullbar b{font-weight:500;letter-spacing:.04em}
.pullbar .why{overflow-wrap:anywhere}
.dim{opacity:.62}
.dim .meta,.dim .note,.dim .mu{color:var(--fg)}
.strike{text-decoration:line-through;text-decoration-thickness:2px}
.lastprice{flex:none;text-align:right;font-size:12px;line-height:16px;white-space:nowrap;padding-top:5px}
.lastprice span{font:600 17px/20px var(--display)}

/* parlay */
.ptitle{font:600 17px/22px var(--display);letter-spacing:.01em}
.leg{padding:8px 0;border-bottom:1px solid var(--line)}
.leg .l1{display:flex;align-items:baseline;gap:8px}
.leg .lname{font:600 17px/22px var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .lprice{font:600 20px/22px var(--display);flex:none}
.leg .l2{font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
.leg .l2 .lb{color:var(--fg)}
.psum{margin-top:8px;font-size:13px;line-height:19px}
.psum .about{font:600 22px/26px var(--display)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.li{display:flex;gap:8px;align-items:center;width:100%;min-height:44px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.li .nm{font:600 18px/22px var(--display);letter-spacing:.01em}
.li .sub{display:block;font-size:12px;line-height:17px;color:var(--muted)}
.li .sub.warn{color:var(--warn)}
.li .r{flex:none;white-space:nowrap;color:var(--muted);text-align:right;font-size:12px;line-height:17px}
.li .r b{display:block;font:600 16px/20px var(--display);color:var(--fg)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:12px;line-height:16px;background:var(--raise);border:1px solid var(--line);color:var(--fg);margin-left:6px;vertical-align:2px;white-space:nowrap}
.badge.pick{border-color:rgba(108,196,240,.6);color:var(--accent)}
.badge.q{border-color:rgba(240,185,92,.6);color:var(--warn)}
.badge.out{border-color:rgba(240,137,122,.6);color:var(--bad)}

/* research */
.search{position:relative;margin-top:6px}
.search input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px;font-size:16px;color:var(--fg)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search .ic{position:absolute;left:12px;top:13px;color:var(--muted);display:flex;pointer-events:none}
.gh{margin:6px 0 10px}
.gh .teams{font:600 34px/36px var(--display);letter-spacing:.02em}
.gh .teams .at{font:400 16px/20px var(--body);color:var(--muted);margin:0 6px;vertical-align:6px}
.gh .sub{font-size:13px;line-height:18px;color:var(--muted)}
.wx{font-size:13px;line-height:18px;margin-top:4px}
.ltable{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:12px;font-size:13px;line-height:18px}
.ltable>div{padding:9px 0;border-bottom:1px solid var(--line);display:flex;align-items:baseline}
.ltable>div:nth-last-child(-n+3){border-bottom:0}
.ltable .k small{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.ltable .k{display:block}
.ltable .v{justify-content:flex-end;white-space:nowrap}
.ltable .v b{font:600 18px/20px var(--display);margin-right:5px}
.ltable .v .mu{font-size:12px}
.dk{display:inline-block;font-size:12px;line-height:16px;padding:0 6px;border-radius:4px;background:rgba(240,185,92,.12);color:var(--warn);margin-left:6px}
.inj{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:18px}
.inj:last-child{border-bottom:0}
.inj .st{flex:none;width:92px;font-weight:500}
.inj .st.out{color:var(--bad)} .inj .st.q{color:var(--warn)}
.inj .who{flex:1;min-width:0;overflow-wrap:anywhere}
.ph{margin:4px 0 10px}
.ph .pn{font:600 32px/34px var(--display);letter-spacing:.01em}
.ph .sub{font-size:13px;line-height:18px;color:var(--muted)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin:4px -2px 0}
.mchip{min-height:44px;display:inline-flex;align-items:center;padding:0 2px}
.mchip span{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:17px;border:1px solid var(--line);font-size:13px;color:var(--fg);white-space:nowrap}
.mchip span b{font:600 16px/16px var(--display)}
.mchip span .per{margin:0;vertical-align:0;font-size:12px;line-height:16px;padding:0 4px}
.mchip.noline span{color:var(--muted);border-style:dashed}
.mchip[aria-pressed="true"] span{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.mchip[aria-pressed="true"] span .per{color:var(--bg);border-color:var(--bg)}
.hitbox{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px}
.hitbox .big{font:600 40px/42px var(--display)}
.hitbox .lab{font-size:13px;line-height:18px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.fact{background:var(--raise);border-radius:8px;padding:8px 8px 7px}
.fact b{display:block;font:600 22px/24px var(--display)}
.fact span{display:block;font-size:12px;line-height:15px;color:var(--muted)}
.chart{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}
.chart .bx{fill:#4a5d72} .chart .bx.hit{fill:var(--good)} .chart .bx.cur{opacity:1}
.chart .ln{stroke:var(--warn);stroke-width:2;stroke-dasharray:5 4}
.chart .lt{fill:var(--warn);font:600 13px var(--display)}
.chart .vl{fill:var(--fg);font:600 13px var(--display);text-anchor:middle}
.chart .xl{fill:var(--muted);font:400 12px var(--body);text-anchor:middle}
.chart .yr{fill:var(--muted);font:400 12px var(--body)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .dnp{fill:var(--muted);font:400 12px var(--body);text-anchor:middle}
.ctx{font-size:14px;line-height:20px;margin-top:10px}
.ctx b{font-weight:500}
.log{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px;line-height:18px}
.log th{font:400 12px/16px var(--body);color:var(--muted);text-align:right;padding:0 0 4px;border-bottom:1px solid var(--line)}
.log td{text-align:right;padding:8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.log th:first-child,.log td:first-child{text-align:left}
.log td.v{font:600 17px/18px var(--display)}
.log td.v.hit{color:var(--good)}
.log tr.dnp td{color:var(--muted)}
.log tr.sep td{padding:6px 0 2px;font-size:12px;color:var(--muted);text-align:left;border-bottom:1px solid var(--line)}

/* empty + skeleton */
.empty .t{font-size:16px;line-height:23px;font-weight:500}
.empty .s{font-size:13px;line-height:19px;color:var(--muted);margin-top:4px}
.skel{height:150px;border-radius:10px;background:var(--surface);border:1px solid var(--line);animation:pulse 1.4s ease-in-out infinite}
.skel.sm{height:20px;width:60%;border-radius:6px}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);font-weight:500;font-size:14px}
.btn.wide{width:100%}

/* footer */
.foot{margin-top:28px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;line-height:18px;color:var(--muted)}
.foot p{margin:6px 0}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabs .in{max-width:520px;margin:0 auto;display:flex;height:52px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;height:52px;color:var(--muted);font:600 18px/22px var(--display);letter-spacing:.03em;position:relative;text-align:center}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}

/* record */
.bigrec{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:6px}
.bigrec .wl{font:600 44px/46px var(--display)}
.bigrec .un{font:600 30px/34px var(--display)}
.subline{font-size:12px;line-height:17px;color:var(--muted);margin-top:2px}
.tbl{margin-top:16px;font-size:13px;line-height:18px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 50px 40px 50px 50px;column-gap:6px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.tr.th{font-size:12px;line-height:15px;color:var(--muted);padding:0 0 4px}
.tr>*{text-align:right;white-space:nowrap}
.tr>:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
.tr .span2{grid-column:span 2}
.tr .few{grid-column:1 / -1;text-align:left;font-size:12px;line-height:15px;color:var(--muted);white-space:normal}
.tr .num{font:600 16px/18px var(--display)}
.tr .lbl small{display:block;font-size:12px;line-height:15px;color:var(--muted)}
.filters{display:flex;gap:2px;margin:14px -6px 0;flex-wrap:wrap}
.fbtn{min-height:44px;display:inline-flex;align-items:center;padding:0 6px}
.fbtn span{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.fbtn[aria-pressed="true"] span{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:500}
.wk{margin-top:18px}
.wk h3{font:600 17px/22px var(--display);letter-spacing:.02em;margin:0 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.wk h3 .mu{font:400 12px/16px var(--body);letter-spacing:0}
.ent{display:flex;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;min-height:44px;align-items:flex-start}
.ent .tg{flex:none;width:44px;font:600 15px/20px var(--display);letter-spacing:.03em}
.tg.W{color:var(--good)} .tg.L{color:var(--bad)} .tg.PUSH,.tg.VOID,.tg.none{color:var(--muted)}
.ent .bd{flex:1;min-width:0}
.ent .e1{font-size:14px;line-height:20px;overflow-wrap:anywhere}
.ent .e1 .pn{font-weight:500}
.ent .e2{font-size:12px;line-height:17px;color:var(--muted);overflow-wrap:anywhere}
.ptag{display:inline-block;font:600 12px/16px var(--display);letter-spacing:.05em;padding:0 5px;margin-right:6px;border:1px solid var(--muted);border-radius:3px;color:var(--fg);vertical-align:1px}
.legs{padding:0 0 0 14px;border-left:2px solid var(--line);margin:0 0 4px 20px}
.legs .ent{min-height:0}

/* sheets */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(3,7,11,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line);flex:none}
.sheet-h h2{font:600 20px/24px var(--display);letter-spacing:.02em;margin:0;flex:1;min-width:0}
.sheet-h .ibtn{margin:0}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(20px + var(--sab));overscroll-behavior:contain}
.rules{margin:8px 0 0;padding:0 0 0 22px}
.rules li{margin:0 0 10px;padding-left:2px;line-height:20px;overflow-wrap:anywhere}
.rules li::marker{color:var(--muted);font-family:var(--display);font-weight:600}
.kv{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:20px;overflow-wrap:anywhere}
.kv:last-child{border-bottom:0}
.kv.bad{color:var(--bad)} .kv.warn{color:var(--warn)}

<body>

<script>
function wkLab(w){ w=+w; return w>18 ? ['WC','DIV','CONF','SB'][Math.min(w-19,3)] : 'W'+w; }

(function () {

/* ================= formatting (always Eastern) ================= */
function dtf(o) { try { o.timeZone = TZ; return new Intl.DateTimeFormat('en-US', o); } catch (e) { delete o.timeZone; return new Intl.DateTimeFormat('en-US', o); } }

function fTime(v) { var t = typeof v === 'number' ? v : ms(v); return t == null ? null : tidy(F_TIME.format(new Date(t))); }

}
/* kickoff: "Thu 8:15 PM" */
function fKick(v) { var t = ms(v); return t == null ? 'time not posted' : fWd(t) + ' ' + fTime(t); }
var WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str(s)); if (!m) return null;
  var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); if (isNaN(d.getTime())) return null;

}
function odds(v) { var n = num(v); if (n == null) return '–'; n = Math.round(n); return n > 0 ? '+' + n : String(n); }
function pctOf(given, raw, down) { var g = num(given); if (g != null) return Math.round(g) + '%'; var n = num(raw); if (n == null) return null; return (down ? Math.floor(n * 100 + 1e-6) : Math.round(n * 100)) + '%'; }

function signCls(v) { var n = num(v); return n == null || n === 0 ? '' : (n > 0 ? 'pos' : 'neg'); }

/* ================= markets ================= */
var MK = { /* label, short noun for bets, stat getter */

  spread: ['Spread', 'spread', null], total: ['Game total', 'points', null], team_total: ['Team total', 'points', null], moneyline: ['Moneyline', 'to win', null]
};
function mkLabel(m) { return MK[m] ? MK[m][0] : str(m).replace(/_/g, ' '); }
/* stats shown per position when Hard Rock has no line (research only) */
var POS_STATS = {
  QB: ['pass_yds', 'pass_td', 'pass_att', 'rush_yds'], RB: ['rush_yds', 'rush_att', 'rec', 'rec_yds', 'anytime_td'],
  WR: ['rec', 'rec_yds', 'long_rec', 'anytime_td'], TE: ['rec', 'rec_yds', 'anytime_td']
};
function statVal(line, market) {
  if (!isObj(line) || !MK[market] || !MK[market][2]) return null;
  var keys = MK[market][2], t = 0;
  for (var i = 0; i < keys.length; i++) { var v = num(line[keys[i]]); if (v == null) return null; t += v; }
  return t;
}
function perWord(p) { return p === '1H' ? '1st half' : 'Full game'; }
function perTag(p) { return h('span', { class: 'per' + (p === '1H' ? ' h1' : ''), title: perWord(p), text: p === '1H' ? '1H' : 'FG' }); }

/* ================= data access ================= */
function uiVal(k) { var u = S.rules && isObj(S.rules.ui) ? num(S.rules.ui[k]) : null; return (u != null && u > 0) ? u : UI_DEF[k]; }
function isFixture() { return !!FIX || [S.slate, S.record, S.rules].some(function (x) { return x && x.fixture === true; }); }
function expired() { var v = S.slate ? ms(S.slate.valid_until) : null; return v != null && now() > v; }
function stale() {

}
function gameMap() { var m = {}; arr(S.slate && S.slate.games).forEach(function (g) { if (isObj(g) && g.id != null) m[g.id] = g; }); return m; }

/* ================= fetch ================= */
function fileErr(m) { var e = new Error(m); e.kind = 'file'; return e; }

}

  return BASE + (g && g.file ? str(g.file).replace(/^\/+/, '') : 'research/' + gid + '.json');
}

/* ================= period toggle ================= */

  var roleKey = pos === 'QB' ? 'pass_att' : (pos === 'RB' ? 'rush_att' : 'targets'), roleW = pos === 'QB' ? 'Att' : (pos === 'RB' ? 'Car' : 'Tgt');
  var t = h('table', { class: 'log' }), hd = h('tr');
  ['Game', mkLabel(market), roleW, 'Snaps'].forEach(function (x) { hd.appendChild(h('th', { scope: 'col', text: x })); });
  t.appendChild(h('thead', null, hd));
  var tb = h('tbody'), lastSeason = null;
  log.forEach(function (x) {
    if (lastSeason != null && x.season !== lastSeason) tb.appendChild(h('tr', { class: 'sep' }, h('td', { colspan: 4, text: x.season + ' season' })));
    lastSeason = x.season;
    var gtxt = wkLab(x.week) + ' ' + (x.home ? 'vs ' : '@ ') + str(x.opp);
    if (!x.played) { tb.appendChild(h('tr', { class: 'dnp' }, h('td', { text: gtxt }), h('td', { colspan: 3, text: 'Did not play' }))); return; }
    var v = statVal(x[pk], market);
    tb.appendChild(h('tr', null, h('td', { text: gtxt }), h('td', { class: 'v' + (lineV != null && v != null && v > lineV ? ' hit' : ''), text: v == null ? '–' : String(v) }),
      h('td', { text: fmtNum(x[pk] && x[pk][roleKey]) }), h('td', { text: num(x.snap_pct) != null ? x.snap_pct + '%' : '–' })));

}

/* ================= RECORD ================= */
function sampleN(r) { var n = num(r.n); return n != null ? n : (num(r.w) || 0) + (num(r.l) || 0); }
function renderRecord() {
  app.appendChild(header('The Record'));
  if (!S.loaded) { app.appendChild(h('div', { class: 'stack' }, h('div', { class: 'skel sm' }), h('div', { class: 'skel' }))); return; }
  if (!S.record) { app.appendChild(loadFail(S.recordErr, 'Record')); app.appendChild(footer()); return; }
  var sum = isObj(S.record.summary) ? S.record.summary : {}, hd = isObj(sum.headline) ? sum.headline : {};
  var minS = num(S.rules && S.rules.values && S.rules.values.min_sample), n = sampleN(hd);
  var few = function (k) { return minS == null || k < minS; };

  if (!n) {
    app.appendChild(h('div', { class: 'card empty', style: 'margin-top:8px' }, h('div', { class: 't', text: 'No graded picks yet.' }),
      h('div', { class: 's', text: 'Every pick and parlay shown on the page lands here and gets graded once its game is final. Nothing is ever removed.' })));
  } else {
    app.appendChild(h('div', { class: 'bigrec' }, h('span', { class: 'wl', text: (num(hd.w) || 0) + '-' + (num(hd.l) || 0) }), h('span', { class: 'un ' + signCls(hd.units), text: units(hd.units, 1) || '' })));
    var sub = ['Singles']; if (num(hd.push)) sub.push(hd.push + ' push'); if (num(hd.void)) sub.push(hd.void + ' void');
    sub.push('1 unit each, at the worst Hard Rock price shown');
    app.appendChild(h('div', { class: 'subline', text: sub.join(' · ') }));
    if (few(n)) { app.appendChild(h('div', { class: 'chance', style: 'margin-top:10px' }, 'Hit ', h('b', { text: (num(hd.w) || 0) + ' of ' + n }))); app.appendChild(h('div', { class: 'subline', text: fewTag })); }
    else { app.appendChild(h('div', { class: 'chance', style: 'margin-top:10px' }, 'Hit ', h('b', { text: pctOf(null, hd.hit_rate) || '–' }), pctOf(null, hd.needed) ? ' · needed ' + pctOf(null, hd.needed) : '')); var b = chanceBar(hd.hit_rate, hd.needed); if (b) app.appendChild(b); }
    var rows = arr(sum.rows).filter(function (r) { return isObj(r) && sampleN(r) + (num(r.push) || 0) + (num(r.void) || 0) > 0; });
    if (rows.length) {
      var tbl = h('div', { class: 'tbl', role: 'table', 'aria-label': 'Record by market' });
      tbl.appendChild(h('div', { class: 'tr th', role: 'row' }, ['', 'W-L', 'Hit', 'Needed', 'Units'].map(function (x) { return h('span', { role: 'columnheader', text: x }); })));
      rows.forEach(function (r) {
        var k = sampleN(r), u = num(r.units);
        var lab = r.key === 'pulled' ? h('span', { class: 'lbl', role: 'cell' }, 'Pulled', h('small', { text: '(not counted above)' })) : h('span', { class: 'lbl', role: 'cell', text: str(r.label || r.key) });
        var tr = h('div', { class: 'tr', role: 'row' }, lab, h('span', { class: 'num', role: 'cell', text: (num(r.w) || 0) + '-' + (num(r.l) || 0) }));
        if (!k) tr.appendChild(h('span', { class: 'span2 mu', role: 'cell', text: '–' }));
        else if (few(k)) { tr.appendChild(h('span', { role: 'cell', text: (num(r.w) || 0) + ' of ' + k })); tr.appendChild(h('span', { class: 'mu', role: 'cell', text: '–' })); }
        else { tr.appendChild(h('span', { role: 'cell', text: pctOf(null, r.hit_rate) || '–' })); tr.appendChild(h('span', { role: 'cell', text: pctOf(null, r.needed) || '–' })); }
        tr.appendChild(h('span', { class: 'num ' + signCls(u), role: 'cell', text: u == null ? '–' : (units(u, 1) || '').replace(/u$/, '') }));
        if (k && few(k)) tr.appendChild(h('span', { class: 'few', text: fewTag }));
        tbl.appendChild(tr);
      });
      app.appendChild(tbl);
    }
    app.appendChild(h('p', { class: 'note', text: 'Graded at the worst Hard Rock price shown on each pick, 1 unit. Push and void are 0 units and left out of the hit rate.' }));
  }

  var weeks = arr(S.record.weeks).filter(isObj);
  if (weeks.some(function (w) { return arr(w.entries).length; })) {
    var fl = h('div', { class: 'filters', role: 'group', 'aria-label': 'Show' });
    [['all', 'All'], ['singles', 'Singles'], ['parlays', 'Parlays'], ['pulled', 'Pulled']].forEach(function (f) {
      fl.appendChild(h('button', { class: 'fbtn', type: 'button', 'aria-pressed': S.filter === f[0] ? 'true' : 'false', on: { click: function () { S.filter = f[0]; render(); } } }, h('span', { text: f[1] })));
    });
    app.appendChild(fl);
  }
  var shown = 0;
  weeks.sort(function (a, b) { return (num(b.week) || 0) - (num(a.week) || 0); }).forEach(function (w) {
    var ents = arr(w.entries).filter(isObj).filter(function (e) {
      if (S.filter === 'singles') return e.kind !== 'parlay' && !e.pulled;
      if (S.filter === 'parlays') return e.kind === 'parlay' && !e.pulled;
      if (S.filter === 'pulled') return !!e.pulled;

    });
    if (!ents.length) return;
    shown++;
    var wl = (num(w.w) || 0) + (num(w.l) || 0), tail = wl ? (num(w.w) || 0) + '-' + (num(w.l) || 0) + (units(w.units, 1) ? ' · ' + units(w.units, 1) : '') : null;
    var sec = h('section', { class: 'wk' }, h('h3', null, str(w.label || 'Week ' + w.week) + (tail ? ' · ' + tail : ''),
      w.graded ? null : h('span', { class: 'mu', text: (tail ? ' so far' : '') + ' · results post once each game is final' })));
    ents.forEach(function (e) { entryRow(e, w).forEach(function (x) { sec.appendChild(x); }); });
    app.appendChild(sec);
  });
  if (!shown && weeks.some(function (w) { return arr(w.entries).length; })) app.appendChild(h('p', { class: 'mu', style: 'margin-top:16px', text: 'Nothing under this filter yet.' }));
  app.appendChild(footer());
}
function entryRow(e, w) {

  var pulledTxt = e.pulled ? 'pulled' + (fStamp(e.pulled.at) ? ' ' + fStamp(e.pulled.at) : '') + (e.pulled.reason ? ': ' + str(e.pulled.reason) : '') : null;
  if (e.kind === 'parlay') {
    var key = str(w.week) + '|' + str(e.id), legs = arr(e.legs).filter(isObj), open = !!S.legsOpen[key];
    if (pulledTxt) l2.push(pulledTxt);
    if (!res) l2.push('Waiting on the result'); else if (e.actual) l2.push(str(e.actual));
    var btn = h('button', { class: 'ent', type: 'button', 'aria-expanded': open ? 'true' : 'false', on: { click: function () { S.legsOpen[key] = !S.legsOpen[key]; render(); } } },
      tag, h('div', { class: 'bd' }, h('div', { class: 'e1' }, ptag, h('span', { class: 'pn', text: 'Parlay' }), ' · ' + legs.length + ' legs · ' + odds(e.price) + (res && units(e.units, 2) ? ' · ' + units(e.units, 2) : '')),
        l2.length ? h('div', { class: 'e2', text: l2.join(' · ') }) : null),

          h('div', { class: 'bd' }, h('div', { class: 'e1' }, h('span', { class: 'pn', text: str(lg.player) }), ' ', perTag(lg.period), str(lg.bet)),
            h('div', { class: 'e2', text: odds(lg.price) + (lg.actual ? ' · ' + str(lg.actual) : '') }))));

  return [h('div', { class: 'ent' }, tag, h('div', { class: 'bd' }, h('div', { class: 'e1' }, ptag, h('span', { class: 'pn', text: str(e.player) }), ' ', e.period ? perTag(e.period) : null, str(e.bet)),
    h('div', { class: 'e2', text: l2.join(' · ') })))];
}

/* ================= routing ================= */
/* #picks (default) · #research · #research/GAME · #research/GAME/PLAYER · #record */
function parseHash(hs) {
  var p = str(hs).replace(/^#\/?/, '').split('/');
  if (p[0] === 'record') return { view: 'record' };
  if (p[0] === 'research') return { view: 'research', game: p[1] ? decodeURIComponent(p[1]) : null, player: p[2] ? decodeURIComponent(p[2]) : null };
  return { view: 'picks' };
}
function routeKey(r) { return r.view + '/' + (r.game || '') + '/' + (r.player || ''); }
var depth = 0; /* in-page steps taken, so Back never leaves the site */
function go(hash) {
  if (hash === '#picks') hash = '';
  if (routeKey(parseHash(location.hash)) === routeKey(parseHash(hash))) { window.scrollTo(0, 0); return; }
  S.scroll[routeKey(S.route)] = window.scrollY || 0;
  try { history.pushState({ d: depth + 1 }, '', location.pathname + location.search + hash); depth++; }
  catch (e) { location.hash = hash; return; }
  route(true);
}
function back(fallback) { if (depth > 0) history.back(); else go(fallback); }
function route(fresh) {
  if (!fresh) S.scroll[routeKey(S.route)] = window.scrollY || 0;
  S.route = parseHash(location.hash);
  render();
  window.scrollTo(0, fresh ? 0 : (S.scroll[routeKey(S.route)] || 0));
}
function renderTabs() {
  clear(tabsEl);
  var mk = function (v, label, hash) { return h('button', { class: 'tab', type: 'button', 'aria-current': S.route.view === v ? 'page' : null, text: label, on: { click: function () { if (S.route.view === v && v === 'research' && S.route.game) go('#research'); else go(hash); } } }); };
  tabsEl.appendChild(h('div', { class: 'in' }, mk('picks', 'Picks', '#picks'), mk('research', 'Research', '#research'), mk('record', 'Record', '#record')));
}
function render() {
  var y = window.scrollY || 0, act = document.activeElement, refocusSearch = act && act.type === 'search', selStart = refocusSearch ? act.selectionStart : 0;
  try {
    clear(app);
    if (S.route.view === 'record') renderRecord();
    else if (S.route.view === 'research') renderResearch();
    else renderPicks();
    renderTabs();
    if (S.sheet) fillSheet();
  } catch (err) {
    clear(app);
    app.appendChild(header('Prop Check NFL'));
    app.appendChild(h('div', { class: 'card empty', style: 'margin-top:12px' }, h('div', { class: 't', text: "This page didn't load right." }),
      h('div', { class: 's', text: 'Nothing is shown rather than something wrong.' }),
      h('div', { style: 'margin-top:12px' }, h('button', { class: 'btn', type: 'button', text: 'Try again', on: { click: function () { location.reload(); } } }))));
    if (window.console) console.warn('render failed', err);
  }
  if (refocusSearch) { var inp = app.querySelector('input[type=search]'); if (inp) { inp.focus(); try { inp.setSelectionRange(selStart, selStart); } catch (e) { /* ignore */ } } }
  window.scrollTo(0, y);
}

/* ================= sheets ================= */
function openSheet(name) {
  S.sheetFocus = document.activeElement; S.sheet = name;
  try { history.pushState({ sheet: name, d: depth }, '', location.href); } catch (e) { /* ignore */ }
  fillSheet();
  var c = sheetRoot.querySelector('.ibtn'); if (c) c.focus();
}
function closeSheet(fromPop) {
  if (!S.sheet) return;
  if (!fromPop && history.state && history.state.sheet) { history.back(); return; }
  S.sheet = null; clear(sheetRoot); document.body.style.overflow = '';
  if (S.sheetFocus && document.contains(S.sheetFocus) && S.sheetFocus.focus) S.sheetFocus.focus();
}
function fillSheet() {
  var old = sheetRoot.querySelector('.sheet-b'), prev = old ? old.scrollTop : 0;
  clear(sheetRoot);
  var title = S.sheet === 'rules' ? 'How picks are made' : 'Update status', body = h('div', { class: 'sheet-b' });
  if (S.sheet === 'rules') rulesBody(body); else statusBody(body);
  var sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'sheet-h' }, h('h2', { text: title }), h('button', { class: 'ibtn', type: 'button', 'aria-label': 'Close', on: { click: function () { closeSheet(false); } } }, icon('close', 22))), body);
  var scrim = h('div', { class: 'scrim', on: { click: function (e) { if (e.target === scrim) closeSheet(false); } } }, sheet);
  sheetRoot.appendChild(scrim); document.body.style.overflow = 'hidden'; body.scrollTop = prev;
}
function rulesBody(body) {
  var r = S.rules;
  body.appendChild(h('div', { class: 'mu', style: 'font-size:12px', text: r ? 'Rules v' + str(r.version) + ' · changed ' + niceDate(r.updated) : "The rules didn't load." }));
  var ol = h('ol', { class: 'rules' });
  arr(r && r.text).forEach(function (s) { ol.appendChild(h('li', { text: str(s) })); });
  body.appendChild(ol);
  body.appendChild(h('p', { class: 'note', text: 'Settled means: Early (posted before the final injury report), Injury report in (final report read), Inactives confirmed (player is active today).' }));
  body.appendChild(h('p', { class: 'note', text: 'All times Eastern. Picks are estimates, not guarantees.' }));
}
function statusBody(body) {
  var sl = S.slate || {}, st = isObj(sl.status) ? sl.status : {};
  var row = function (v, cls) { body.appendChild(h('div', { class: 'kv' + (cls ? ' ' + cls : '') , text: v })); };
  row(fStamp(sl.generated_at) ? 'Last update ' + fStamp(sl.generated_at) : 'Last update time not on file', stale() ? 'bad' : null);
  if (fStamp(sl.next_check)) row('Next check ' + fStamp(sl.next_check));
  var od = isObj(st.odds) ? st.odds : {}, oa = fStamp(od.at);
  var ot = { ok: oa ? 'Hard Rock prices read ' + oa : 'Hard Rock prices read', not_yet: 'Hard Rock prices not read yet this week', limited: 'Hard Rock prices read ' + (oa || '') + '. Some games or markets skipped to save odds keys.',
    pool_empty: 'No new Hard Rock prices: out of odds keys.' + (oa ? ' Last read ' + oa + '.' : ''), feed_down: 'The odds feed is not answering.' + (oa ? ' Last read ' + oa + '.' : ''),
    keys_refused: 'The odds keys were refused. New keys are needed.' }[od.state] || (oa ? 'Prices read ' + oa : 'Prices not read yet');
  row(ot, /pool_empty|feed_down|keys_refused/.test(str(od.state)) ? 'bad' : null);
  var inj = isObj(st.injuries) ? st.injuries : {};
  row(inj.state === 'down' ? "Injury news isn't loading. Last good read " + (fStamp(inj.at) || 'unknown') + '.' : (fStamp(inj.at) ? 'Injury news read ' + fStamp(inj.at) : 'Injury news not read yet'), inj.state === 'down' ? 'warn' : null);
  var ia = isObj(st.inactives) ? st.inactives : {};
  row(ia.state === 'ok' ? 'Inactives read ' + (fStamp(ia.at) || '') + (ia.note ? '. ' + str(ia.note) : '') : ia.state === 'down' ? "Inactives aren't loading." : 'Inactives not posted yet. They come out about 90 minutes before kickoff.', ia.state === 'down' ? 'warn' : null);
  var sts = isObj(st.stats) ? st.stats : {};
  row(sts.through_week ? 'Stats through week ' + sts.through_week + (sts.state === 'behind' ? ' (behind)' : '') : 'Stats not built yet', sts.state === 'behind' ? 'warn' : null);
  var pi = poolInfo(st), pool = isObj(st.pool) ? st.pool : {};
  if (pi) row(pi.text + (num(pool.keys_live) != null ? '. ' + pool.keys_live + ' of ' + fmtNum(pool.keys) + ' keys still have pulls.' : '.'), pi.cls === 'badt' ? 'bad' : (pi.cls ? 'warn' : null));
  var lr = isObj(st.last_run) ? st.last_run : null;
  if (lr && lr.ok === false) row('The last update failed' + (fStamp(lr.at) ? ' at ' + fStamp(lr.at) : '') + (lr.failed_step ? ' (' + str(lr.failed_step) + ')' : '') + '.', 'bad');
  arr(sl.games).filter(function (g) { return isObj(g) && g.note; }).forEach(function (g) { row(str(g.away) + ' at ' + str(g.home) + ': ' + str(g.note), 'warn'); });
  body.appendChild(h('p', { class: 'note', text: 'This page checks for updates about every ' + Math.round(uiVal('refresh_sec') / 60) + ' minutes while open. All times Eastern.' }));
}

/* ================= wiring ================= */
window.addEventListener('popstate', function (e) {
  depth = (e.state && num(e.state.d) != null) ? e.state.d : 0;
  if (S.sheet) { closeSheet(true); return; }
  route(false);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) closeSheet(false); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) load().then(schedule); });
setInterval(function () { if (S.loaded && !document.hidden && !document.querySelector('input:focus')) render(); }, 60000);

S.route = parseHash(location.hash);
try { history.replaceState({ d: 0 }, '', location.href); } catch (e) { /* ignore */ }
renderTabs();
load().then(schedule);
})();
